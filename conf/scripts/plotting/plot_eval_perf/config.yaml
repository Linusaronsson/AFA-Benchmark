hydra:
  searchpath:
    - file://conf
    - file://conf/components
    - file://conf/global

defaults:
  - plot_eval_perf
  - hydra: custom
  - /scripts/plotting/common@plotting: default
  - _self_
  - optional dataset_override@_global_: null
  - override hydra/job_logging: output_dir_colorlog
  - override hydra/hydra_logging: colorlog

input: ???
output_folder: ???
# Optional additional figures use the unsplit table for this method set and
# an independent output root (not nested inside output_folder).
per_dataset_plots: false
per_dataset_input: null
per_dataset_output_folder: null
# Dataset set name -> datasets, given with the force-add prefix:
# '++dataset_sets={all:[cube,mnist]}'. The pipeline passes the run's
# dataset sets.
dataset_sets: ???
formats:
  - pdf
