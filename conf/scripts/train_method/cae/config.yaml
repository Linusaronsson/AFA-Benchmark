hydra:
  searchpath:
    - file://conf
    - file://conf/components
    - file://conf/global

defaults:
  - train_cae
  - hydra: custom
  - initializer: ???
  - unmasker: ???
  - dataset_key: ???
  - _self_
  - optional experiment@_global_: ${dataset_key}
  - override hydra/job_logging: output_dir_colorlog
  - override hydra/hydra_logging: colorlog
  - override hydra/launcher: custom_slurm

# Defaults for every dataset key; experiment/<key>.yaml overrides them
batch_size: 128
selector:
  lr: 0.001
  nepochs: 250
  num_cells: [128, 128]
  patience: 5
classifier:
  lr: 0.001
  nepochs: 250
  num_cells: [128, 128]
architecture_kind: TABULAR
image_architecture:
  backbone_type: resnet50
  image_size: 224
  patch_size: 16
