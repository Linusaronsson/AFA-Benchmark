hydra:
  searchpath:
    - file://conf
    - file://conf/components
    - file://conf/global

defaults:
  - pretrain_dime
  - hydra: custom
  - initializer: ???
  - unmasker: ???
  - dataset_key: ???
  - _self_
  - optional dataset_override@_global_: ${dataset_key}
  - override hydra/job_logging: output_dir_colorlog
  - override hydra/hydra_logging: colorlog
  - override hydra/launcher: custom_slurm

# Defaults for every dataset key; dataset_override/<key>.yaml overrides them
batch_size: 128
lr: 0.001
nepochs: 200
patience: 5
min_masking_probability: 0.0
max_masking_probability: 0.9
architecture_kind: TABULAR
tabular_architecture:
  activation: ReLU
  hidden_units: [128, 128]
  dropout: 0.3
image_architecture:
  backbone_type: resnet50
  image_size: 224
  patch_size: 16
