hydra:
  searchpath:
    - file://conf
    - file://conf/components
    - file://conf/global

defaults:
  - pretrain_l2m
  - hydra: custom
  - initializer: ???
  - unmasker: ???
  - dataset_key: ???
  - _self_
  - optional experiment@_global_: ${dataset_key}
  - override hydra/job_logging: output_dir_colorlog
  - override hydra/hydra_logging: colorlog
  - override hydra/launcher: custom_slurm

# Paper hyperparameters for MiniBooNE (arXiv:2510.12624, Tables 2 and 3,
# Appendix A.5.6), the family default for every dataset.

# Set per pretrained model name in the pretrain mapping: real or synthetic.
feature_source: ???
architecture:
  model_dim: 256
  embedding_depth: 4
  n_layers: 6
  n_heads: 4
  feedforward_dim: 512
batch_size: 8 # tasks per step
sequence_length: 1000
n_steps: 100000
lr: 1e-4
warmup_steps: 500
checkpoint_interval: 500
n_validation_tasks: 64 # not stated by the paper
missingness_cap: 0.5
