hydra:
  searchpath:
    - file://conf
    - file://conf/components
    - file://conf/global

defaults:
  - pretrain_ol
  - hydra: custom
  - initializer: ???
  - unmasker: ???
  - dataset_key: ???
  - /components/masked_pretraining@_global_: default
  - _self_
  - optional experiment@_global_: ${dataset_key}
  - override hydra/job_logging: output_dir_colorlog
  - override hydra/hydra_logging: colorlog
  - override hydra/launcher: custom_slurm

supervised_learning:
  early_stopping_min_delta: 1e-3

# batch size set to jafa paper default, since ol does not specify it

lr: 1e-3
pq_module:
  n_hiddens: [64,32,16] # ol implementation for Diabetes
  p_dropout: 0.5 # ol implementation
  use_feature_mask: false # like original paper
