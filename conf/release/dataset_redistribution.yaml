# Dataset release policy, maintained when adding a dataset, not per release.
# Every pipeline dataset key must have an explicit entry, even when its
# redistribution permission is unreviewed. Missing entries are errors.
#
# Redistribution permission and bundle inclusion are independent:
#   status: permitted | restricted | unreviewed
#   bundle_policy: include | omit
#   omission_reason: required for omit; absent/null for include
# Only permitted + include bundles are packaged. Models and evaluation
# results remain eligible regardless. Synthetic datasets are explicitly
# omitted for local regeneration, not for missing redistribution permission.
#
# license, source, reviewed_by and notes document the review; null means
# unknown or not applicable. Being able to generate third-party data grants
# no redistribution rights. See docs/reference/release_manifest.md.
datasets:
  actg:
    status: unreviewed
    bundle_policy: include
    source: https://archive.ics.uci.edu/dataset/890/aids+clinical+trials+group+study+175
    notes: No data license stated by the provider.
  bank_marketing:
    status: permitted
    bundle_policy: include
    license: CC-BY-4.0
    source: https://archive.ics.uci.edu/dataset/222/bank+marketing
    reviewed_by: valterschutz
  ckd:
    status: permitted
    bundle_policy: include
    license: CC-BY-4.0
    source: https://archive.ics.uci.edu/dataset/336/chronic+kidney+disease
    reviewed_by: valterschutz
  cube: &synthetic
    status: permitted
    bundle_policy: omit
    omission_reason: synthetic dataset; regenerate locally
    license: MIT
    source: src/afabench/datasets/
    notes: Generated by AFABench, not obtained from a third-party dataset.
  cube_without_noise: *synthetic
  cube_nm: *synthetic
  cube_nm_without_noise: *synthetic
  cube_nonuniform_costs: *synthetic
  diabetes:
    status: permitted
    bundle_policy: include
    license: https://www.cdc.gov/nchs/policy/data-user-agreement.html
    source: https://github.com/iancovert/dynamic-selection
    reviewed_by: valterschutz
  fashion_mnist:
    status: permitted
    bundle_policy: include
    license: MIT
    source: https://github.com/zalandoresearch/fashion-mnist
    reviewed_by: valterschutz
  imagenette:
    status: unreviewed
    bundle_policy: include
    source: https://github.com/fastai/imagenette
    notes: Bundles hold indices and configuration, not source images; redistribution review pending.
  metabric:
    status: permitted
    bundle_policy: include
    license: ODbL-1.0
    source: https://www.kaggle.com/datasets/raghadalharbi/breast-cancer-gene-expression-profiles-metabric
    reviewed_by: valterschutz
  miniboone:
    status: permitted
    bundle_policy: include
    license: CC-BY-4.0
    source: https://archive.ics.uci.edu/dataset/199/miniboone+particle+identification
    reviewed_by: valterschutz
  miniboone_subset:
    status: permitted
    bundle_policy: include
    license: CC-BY-4.0
    source: https://archive.ics.uci.edu/dataset/199/miniboone+particle+identification
    reviewed_by: valterschutz
  mnist:
    status: unreviewed
    bundle_policy: include
    source: http://yann.lecun.com/exdb/mnist/
    notes: No data license stated by the provider.
  physionet_challenge_2012:
    status: permitted
    bundle_policy: include
    license: ODC-By-1.0
    source: https://physionet.org/content/challenge-2012/1.0.0/
    reviewed_by: valterschutz
  synthetic_mnist: *synthetic
  synthetic_mnist_without_noise: *synthetic
