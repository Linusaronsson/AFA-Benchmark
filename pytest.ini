[tool:pytest]
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
addopts = -v --tb=short
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[pytest]
markers =
    optional: tests that are skipped unless explicitly selected
    pipeline: pipeline/system tests that are skipped unless explicitly selected
    workflow: Snakemake workflow tests (test/workflow/), run by just qa only when workflow files change
addopts = -m "not optional and not pipeline and not workflow" -n auto
# Enable cache directory for pytest
cache_dir = .pytest_cache
