# Preserve existing requested limits until measured durations justify changes.
walltime:
  default_hours: 4
  rules:
    train_method:
      methods:
        l2m_official:
          # MiniBooNE training reached ~38,000/50,000 steps in 4 hours;
          # allow headroom above the projected ~5.3-hour full run.
          # METABRIC training reached 39,600-49,600/50,000 steps in 4 hours.
          datasets:
            miniboone_subset: 8
            metabric: 8
    pretrain_model:
      pretrained_models:
        l2m_official:
          # The authors' METABRIC config doubles the steps of the family
          # default (50,000 steps ran in about 3 hours on miniboone_subset).
          datasets:
            metabric: 8

# CPU nodes are x86_64 and GPU nodes aarch64 (GH200), so each allocation
# names the image built for its nodes by containers/build.sbatch.
execution_site:
  cpu:
    slurm_partition: cpu
    slurm_account: naiss2026-4-1737-cpu
    image: containers/afabench-x86_64.sif
  gpu:
    slurm_partition: gpu
    slurm_account: naiss2026-4-1737-gpu
    gpu: 1
    image: containers/afabench-aarch64.sif
