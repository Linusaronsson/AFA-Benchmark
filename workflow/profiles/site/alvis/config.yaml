executor: slurm
jobs: 9001
latency-wait: 30 # seconds

default-resources:
  runtime: 120 # minutes
  mem_mb: 0 # Only memory attribute that works

# Requested walltime is configured in site.yaml.

# For Snakemake run without the pipeline launcher, which passes this again
# with any overrides: Snakemake replaces this section with --config.
config:
  execution_site_file: workflow/profiles/site/alvis/site.yaml
