# Illustrative site only: replace partitions/accounts in site.yaml.
executor: slurm
jobs: 9001
latency-wait: 30
default-resources:
  runtime: 120
  mem_mb: 4000
  cpus_per_task: 1
set-resources:
  # Requested walltime is configured in site.yaml.
  train_method:
    cpus_per_task: 8
  eval_method:
    cpus_per_task: 8
# For Snakemake run without the pipeline launcher, which passes this again
# with any overrides: Snakemake replaces this section with --config.
config:
  execution_site_file: workflow/profiles/site/examples/mixed-gpus/site.yaml
