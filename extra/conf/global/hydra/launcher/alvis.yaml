# Alvis (C3SE, NAISS). Kept because the main-benchmark results in
# extra/output/alvis were produced here, but Vera is the primary now.
#
# Alvis quirks that do not transfer: GPUs are requested with `--gres`, not
# `--gpus-per-node`, and explicit memory requests are rejected.
defaults:
    - submitit_slurm

submitit_folder: ${hydra.sweep.dir}/.submitit/%j
timeout_min: 1440  # 24 hours

partition: alvis
account: NAISS2026-4-39

additional_parameters:
    gres: gpu:T4:1
