hydra:
  searchpath:
    - file://extra/conf
    - file://extra/conf/global

defaults:
  - train_jafa
  - hydra: custom
  - initializer: ???
  - unmasker: ???
  - dataset_key: ???
  - /components/mdps@mdp: default
  - /components/rl_training_loops@rl_training_loop: default
  - _self_
  - optional experiment@_global_: ${dataset_key}
  - override hydra/job_logging: output_dir_colorlog
  - override hydra/hydra_logging: colorlog
  - override hydra/launcher: custom_slurm

# The script copies the contract's hard_budget onto mdp.hard_budget.
mdp:
  hard_budget: ???
# rl_training_loop set as component

agent:
  eps_init: 1.0 # jafa paper
  eps_end: 0.1 # jafa paper
  eps_annealing_fraction: 0.5

  num_epochs: 1 # jafa paper
  max_grad_norm: 9001 # not specified by jafa paper
  lr: 1e-3
  update_tau: 0.005

  action_value_num_cells: [32, 32] # jafa paper
  action_value_dropout: 0.0

  loss_function: "l2" # jafa paper
  delay_value: true # jafa paper
  double_dqn: true # jafa paper

  gamma: 1.0
  lmbda: 0.75
pretrained_model_lr: 1e-3
activate_joint_training_after_fraction: 0.0
