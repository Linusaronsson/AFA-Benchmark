hydra:
  searchpath:
    - file://extra/conf
    - file://extra/conf/global

defaults:
  - hydra: custom
  - _self_
  - dataset@_global_: cube
  - components/initializers@initializer: ???
  - components/unmaskers@unmasker: ???
  - optional experiment@_global_: ???
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog
  - override hydra/launcher: custom_slurm

# ============================================================================
# AACO Oracle Parameters
# ============================================================================
# k_neighbors: Number of nearest neighbors for AACO oracle (default: 5)
# acquisition_cost: Cost per feature acquisition (controls soft budget)
#   - Higher cost = fewer features acquired
#   - Typical range: 0.001 - 0.2 depending on dataset
# hide_val: Value used for unobserved features (0.0 for consistency with MLP)
# missingness_objective:
#   - mask_aware: current overlap-aware retrospective scoring
#   - doubly_robust: mask-aware augmentation plus marginal IPW correction
# dr_min_propensity: lower clip on estimated support propensities
# dr_max_weight: optional upper clip on inverse propensity weights

aco:
  k_neighbors: 5
  acquisition_cost: 0.05
  hide_val: 0.0
  missingness_objective: "mask_aware"
  dr_min_propensity: 0.001
  dr_max_weight: 20.0
  evaluate_final_performance: true
  eval_only_n_samples: null

# ============================================================================
# Required paths (must be provided)
# ============================================================================
train_dataset_bundle_path: ???
val_dataset_bundle_path: ???
classifier_bundle_path: ???
pretrained_model_bundle_path: null
save_path: ???

# ============================================================================
# Budget settings
# ============================================================================
# soft_budget_param: Overrides aco.acquisition_cost if provided
# hard_budget: If set, forces acquisition until budget is reached
#   (null = soft budget)

soft_budget_param: null
hard_budget: null

# ============================================================================
# Train-time missingness for AACO oracle fitting
# ============================================================================
# full: fit on complete training features (control setting)
# zero_fill: hide training-time forbidden features from the initializer and
#            zero-fill them in the retrospective training table
# impute_mean: hide training-time forbidden features and mean-impute them
# mask_aware: zero-fill training-time forbidden features and pass the resulting
#             training-support mask to the oracle so KNN/scoring use only
#             shared available training features
# pvae_restore_actions: use a pretrained PVAE to impute training-time forbidden
#                       features, then fit AACO as if the full action space were
#                       available. Requires pretrained_model_bundle_path.
# For initializers without forbidden training features (e.g. cold),
# zero_fill/impute_mean/mask_aware/pvae_restore_actions collapse to the
# full-train control.
# pvae_restore_use_label: condition the PVAE restoration on the one-hot
#                         training label (episode-start restoration targets
#                         p(x_miss | x_obs, y); set false for the label-free
#                         ablation).
train_missing_mode: "full"
pvae_restore_use_label: true

# ============================================================================
# Other settings
# ============================================================================
seed: 42
device: "cpu"
use_wandb: false
initializer_type: "aaco"
unmasker_type: "one_based_index"
smoke_test: false
