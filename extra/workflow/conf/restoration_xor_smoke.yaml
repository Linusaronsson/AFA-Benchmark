# XOR noisy-shortcut restoration smoke workflow (Phase A):
# - one dataset instance, one hard budget (b=2)
# - cold control + MCAR at p=0.5 (only x2 is maskable)
# - full restoration ladder per method family:
#     restricted -> reweight -> honest restore -> oracle-generator restore
#     -> oracle completion
# Route-recovery question: does restoration make the policy acquire x2 at
# eval (recovering the x1 -> x2 route that restricted training removes)?

datasets: [xor_noisy_shortcut]
dataset_instance_indices: [0]
train_initializers: [cold, xor_mcar_p05]
methods:
  # AACO ladder
  - aaco_zero_fill
  - aaco_mask_aware
  - aaco_dr
  - aaco_pvae_restore_honest
  - aaco_pvae_restore_labelfree
  - aaco_pvae_restore_actions # oracle-generator
  - aaco_full # oracle completion
  # OL (RL) ladder
  - ol_with_mask # restricted baseline
  - ol_pvae_restore_honest
  - ol_pvae_restore_labelfree
  - ol_pvae_restore_oracle_gen
  - ol_full # oracle completion
  # Myopic reference
  - gadgil2023
  - gadgil2023_ipw_feature_marginal
classifier_types: [external]
smoke_test: true
use_wandb: false
device: cpu
# Local smoke: run gpu-flagged pretrains/trainings on CPU. Remove (or set
# gpu: cuda) when running on a cluster.
compute_platform_devices:
  cpu: cpu
  gpu: cpu
pipeline_cores: 4
comparison_method_set_name: restoration_smoke
plot_eval_hard_budget: 2.0
plot_keep_largest_hard_budget: false

pipeline_configfiles:
  - extra/workflow/conf/train_missing_eval_cold_hard.yaml
  - extra/workflow/conf/datasets_main.yaml
  - extra/workflow/conf/methods.yaml
  - extra/workflow/conf/method_sets.yaml
  - extra/workflow/conf/eval_hard_budgets_single.yaml
  - extra/workflow/conf/soft_budget_params_none.yaml
  - extra/workflow/conf/method_options.yaml
  - extra/workflow/conf/pretrain_mapping.yaml
  - extra/workflow/conf/classifier_names.yaml
  - extra/workflow/conf/unmaskers.yaml
