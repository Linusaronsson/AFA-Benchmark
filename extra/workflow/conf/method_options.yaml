method_options:
  aaco:
    train_script_name: "aaco"
    compute_platform: cpu
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  aaco_full:
    train_script_name: "aaco"
    compute_platform: cpu
    method_specific_params:
      - "train_missing_mode=full"
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  # Block-only baseline: train on the initializer support, but do not pass
  # retrospective support masks into the AACO oracle.
  aaco_zero_fill:
    train_script_name: "aaco"
    compute_platform: cpu
    method_specific_params:
      - "train_missing_mode=zero_fill"
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  aaco_impute_mean:
    train_script_name: "aaco"
    compute_platform: cpu
    method_specific_params:
      - "train_missing_mode=impute_mean"
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  aaco_mask_aware:
    train_script_name: "aaco"
    compute_platform: cpu
    method_specific_params:
      - "train_missing_mode=mask_aware"
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  aaco_dr:
    train_script_name: "aaco"
    compute_platform: cpu
    method_specific_params:
      - "train_missing_mode=mask_aware"
      - "aco.missingness_objective=doubly_robust"
      - "aco.dr_min_propensity=0.001"
      - "aco.dr_max_weight=20.0"
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  # Oracle-generator restoration: the PVAE is pretrained WITHOUT the
  # availability restriction (initializer "cold"), so it has seen the true
  # values of training-missing entries. Upper-bound ablation; the honest
  # method is aaco_pvae_restore_honest below.
  aaco_pvae_restore_actions:
    pretrained_model_name: "pvae"
    pretrained_model_initializer: "cold"
    train_script_name: "aaco"
    compute_platform: cpu
    method_specific_params:
      - "train_missing_mode=pvae_restore_actions"
    hard_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
    soft_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
  # Honest restoration: the PVAE is pretrained under the same training
  # missingness as the method (pvae_missing follows the active
  # TRAIN_INITIALIZER), so no hidden values leak. Label-conditioned
  # episode-start restoration (the trajectory target p(x_miss | x_obs, y)).
  aaco_pvae_restore_honest:
    pretrained_model_name: "pvae_missing"
    train_script_name: "aaco"
    compute_platform: cpu
    method_specific_params:
      - "train_missing_mode=pvae_restore_actions"
    hard_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
    soft_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
  # Ablation of aaco_pvae_restore_honest: restoration without label
  # conditioning (targets p(x_miss | x_obs) instead of p(x_miss | x_obs, y)).
  aaco_pvae_restore_labelfree:
    pretrained_model_name: "pvae_missing"
    train_script_name: "aaco"
    compute_platform: cpu
    method_specific_params:
      - "train_missing_mode=pvae_restore_actions"
      - "pvae_restore_use_label=false"
    hard_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
    soft_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
  aaco_nn:
    pretrained_model_name: "aaco"
    train_script_name: "aaco_nn"
    compute_platform: gpu
    hard_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
    soft_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
  ma2018_builtin:
    pretrained_model_name: "pvae"
    train_script_name: "ma2018_builtin"
    compute_platform: gpu
    use_max_hard_budget_when_training_soft_budget: true
    eval_batch_size:
      default: 8
    eval_to_train_hard_budget_mapping:
      cube_nonuniform_costs:
        2: 20
        4: 20
        7: 20
    hard_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
    soft_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
  ma2018_external:
    pretrained_model_name: "pvae"
    train_script_name: "ma2018_external"
    compute_platform: gpu
    use_max_hard_budget_when_training_soft_budget: true
    eval_batch_size:
      default: 8
    eval_to_train_hard_budget_mapping:
      cube_nonuniform_costs:
        2: 20
        4: 20
        7: 20
    hard_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
    soft_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
  covert2023:
    pretrained_model_name: "gdfs"
    train_script_name: "covert2023"
    compute_platform: gpu
    use_max_hard_budget_when_training_soft_budget: true
    eval_batch_size:
      default: 32
    eval_to_train_hard_budget_mapping:
      cube_nonuniform_costs:
        2: 20
        4: 20
        7: 20
  # Block-only DIME baseline; IPW variants are listed separately below.
  gadgil2023:
    pretrained_model_name: "dime"
    train_script_name: "gadgil2023"
    compute_platform: gpu
    use_max_hard_budget_when_training_soft_budget: true
    eval_batch_size:
      default: 32
    eval_to_train_hard_budget_mapping:
      cube_nonuniform_costs:
        2: 20
        4: 20
        7: 20
  gadgil2023_ipw_feature_marginal:
    pretrained_model_name: "dime"
    train_script_name: "gadgil2023"
    compute_platform: gpu
    method_specific_params:
      - "ipw_mode=feature_marginal"
      - "ipw_min_propensity=0.001"
      - "ipw_max_weight=10.0"
      - "ipw_normalize_weights=true"
    use_max_hard_budget_when_training_soft_budget: true
    eval_batch_size:
      default: 32
    eval_to_train_hard_budget_mapping:
      cube_nonuniform_costs:
        2: 20
        4: 20
        7: 20
  cae:
    train_script_name: "cae"
    compute_platform: gpu
    eval_to_train_hard_budget_mapping:
      cube_nonuniform_costs:
        2: 20
        4: 20
        7: 20
    hard_budget_ignored_datasets: [cube_nm, cube_nm_without_noise]
    soft_budget_ignored_datasets: [cube_nm, cube_nm_without_noise]
  permutation:
    train_script_name: "permutation"
    compute_platform: gpu
    eval_to_train_hard_budget_mapping:
      cube_nonuniform_costs:
        2: 20
        4: 20
        7: 20
    hard_budget_ignored_datasets: [cube_nm, cube_nm_without_noise, imagenette]
    soft_budget_ignored_datasets: [cube_nm, cube_nm_without_noise, imagenette]
  jafa:
    pretrained_model_name: "jafa"
    train_script_name: "shim2018"
    compute_platform: gpu
    eval_batch_size: &rl_eval_batch_size
      default: 128
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette, mnist, fashion_mnist] # (fashion)_mnist needs more tuning
  odin_model_based:
    pretrained_model_name: "pvae"
    train_script_name: "zannone2019"
    compute_platform: gpu
    method_specific_params:
      - "additional_generation_fraction=1.0"
    eval_batch_size: *rl_eval_batch_size
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette, mnist] # mnist too difficult to tune
  odin_model_free:
    pretrained_model_name: "pvae"
    train_script_name: "zannone2019"
    compute_platform: gpu
    method_specific_params:
      - "additional_generation_fraction=0.0"
    eval_batch_size: *rl_eval_batch_size
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette, mnist] # mnist too difficult to tune
  ol_without_mask:
    pretrained_model_name: "ol_without_mask"
    train_script_name: "kachuee2019"
    compute_platform: gpu
    eval_batch_size: *rl_eval_batch_size
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  ol_with_mask:
    pretrained_model_name: "ol_with_mask"
    train_script_name: "kachuee2019"
    compute_platform: gpu
    eval_batch_size: *rl_eval_batch_size
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  # Oracle completion: under a train-missing initializer, train on the true
  # features with the full action set (upper bound for OL restoration).
  ol_full:
    pretrained_model_name: "ol_with_mask"
    train_script_name: "kachuee2019"
    compute_platform: gpu
    method_specific_params:
      - "train_missing_mode=full"
    eval_batch_size: *rl_eval_batch_size
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  # Honest episode-start restoration: complete each masked training row once
  # with the pvae_missing generator (pretrained under the same training
  # missingness), then train OL with the full action set.
  ol_pvae_restore_honest:
    pretrained_model_name: "ol_with_mask"
    restoration_model_name: "pvae_missing"
    train_script_name: "kachuee2019"
    compute_platform: gpu
    method_specific_params:
      - "train_missing_mode=pvae_restore"
    eval_batch_size: *rl_eval_batch_size
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  # Oracle-generator ablation: restoration with a PVAE pretrained on complete
  # rows (initializer "cold"), i.e. it has seen the true hidden values.
  ol_pvae_restore_oracle_gen:
    pretrained_model_name: "ol_with_mask"
    restoration_model_name: "pvae"
    restoration_model_initializer: "cold"
    train_script_name: "kachuee2019"
    compute_platform: gpu
    method_specific_params:
      - "train_missing_mode=pvae_restore"
    eval_batch_size: *rl_eval_batch_size
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  # Label-free ablation of ol_pvae_restore_honest.
  ol_pvae_restore_labelfree:
    pretrained_model_name: "ol_with_mask"
    restoration_model_name: "pvae_missing"
    train_script_name: "kachuee2019"
    compute_platform: gpu
    method_specific_params:
      - "train_missing_mode=pvae_restore"
      - "restoration_use_label=false"
    eval_batch_size: *rl_eval_batch_size
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  random_dummy:
    train_script_name: "random_dummy"
    compute_platform: cpu
    eval_batch_size: &dummy_eval_batch_size
      default: 128
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  sequential_dummy:
    train_script_name: "sequential_dummy"
    compute_platform: cpu
    eval_batch_size: *dummy_eval_batch_size
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  stop_baseline:
    train_script_name: "stop_baseline"
    compute_platform: cpu
    eval_batch_size: *dummy_eval_batch_size
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  cube_nm_ar_oracle:
    train_script_name: "cube_nm_ar_oracle"
    compute_platform: cpu
    eval_batch_size: *dummy_eval_batch_size
    hard_budget_ignored_datasets:
      - cube
      - cube_nonuniform_costs
      - cube_nm_3ctx
      - cube_nm
      - cube_nm_without_noise
      - synthetic_mnist
      - cube_without_noise
      - cube_nm_3ctx_without_noise
      - mnist
      - actg
      - bank_marketing
      - ckd
      - diabetes
      - fico
      - fashion_mnist
      - imagenette
      - miniboone
      - pharyngitis
      - physionet
    soft_budget_ignored_datasets:
      - cube
      - cube_nonuniform_costs
      - cube_nm_3ctx
      - cube_nm
      - cube_nm_without_noise
      - synthetic_mnist
      - cube_without_noise
      - cube_nm_3ctx_without_noise
      - mnist
      - actg
      - bank_marketing
      - ckd
      - diabetes
      - fico
      - fashion_mnist
      - imagenette
      - miniboone
      - pharyngitis
      - physionet
