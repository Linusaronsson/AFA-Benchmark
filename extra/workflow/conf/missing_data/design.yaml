# Scientific design shared by the smoke check and named experiments.
# Dataset/method selections and their implementation details come from the
# ordinary benchmark configuration files included by each profile.
initializer: cold
use_wandb: false
include_complete_data: true

dataset_instance_indices: [0, 1, 2, 3, 4]

# Training missingness currently operates on flat feature tensors. Imagenette
# remains in the benchmark catalog but is excluded from this study until an
# image-aware missingness mechanism is defined.
missing_data_unsupported_datasets:
  - imagenette

missingness:
  mechanisms:
    - mcar
    - mar
    - mnar_logistic
    - mnar_self
  probabilities: [0.3, 0.5, 0.7]
  p_obs: 0.3
  p_params: 0.3
  exclude_inputs: true

strategies:
  - restricted
  - zero_fill
  - mean_fill
  - pvae_label_conditioned
  - pvae_label_free
  - pvae_oracle
  - true_completion
  - pvae_stepwise

# Two thousand batches recovered OL's non-myopic CUBE-NM route in the
# complete-data calibration; 200 undertrained it and the global 10000-batch
# benchmark default is unnecessary here. Keep this study-wide so every OL
# state representation receives the same training budget.
train_runtime_params:
  ol_without_mask: &ol_training
    - rl_training_loop.n_batches=2000
    - rl_training_loop.frames_per_batch=256
    - rl_training_loop.eval_n_times=10
  ol_with_mask: *ol_training
  ol_full_state: *ol_training

# Missingness-only behavior is layered onto shared base methods. Definitions
# such as script names, pretrained models, dataset exclusions, and normal
# method parameters continue to come from method_options/*.yaml.
missing_data_method_overrides:
  aaco:
    train_params:
      - aco.missingness_objective=support_aware
  random_dummy:
    # Random acquisition does not learn from the training view. One
    # complete-data run is the reference for every missingness cell.
    allowed_strategies: []

missing_data_method_variants:
  aaco_doubly_robust:
    base_method: aaco
    train_params:
      - aco.missingness_objective=doubly_robust
    allowed_strategies:
      - restricted
    include_complete_data: false
  dime_feature_marginal_ipw:
    base_method: dime
    train_params:
      - ipw_mode=feature_marginal
    allowed_strategies:
      - restricted
    include_complete_data: false
