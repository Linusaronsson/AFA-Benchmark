# Shared training settings for the induced and native studies.
initializer: cold
use_wandb: false
include_complete_data: true

dataset_instance_indices: [0, 1, 2, 3, 4]

# Training missingness currently operates on flat feature tensors. Imagenette
# remains in the benchmark catalog but is excluded from this study until an
# image-aware missingness mechanism is defined.
missing_data_unsupported_datasets:
  - imagenette

missingness:
  mechanisms:
    - mcar
    - mar
    - mnar_logistic
    - mnar_self
  probabilities: [0.3, 0.5, 0.7]
  p_obs: 0.3
  p_params: 0.3
  exclude_inputs: true

strategies:
  - restricted
  - zero_fill
  - mean_fill
  - pvae_label_conditioned
  - pvae_label_free
  - pvae_oracle
  - true_completion
  - pvae_stepwise

# Stepwise restoration scores every candidate acquisition through the PVAE.
# A smaller evaluation batch is equivalent but avoids a large candidate tensor.
stepwise_eval_batch_size: 16

# Training budgets fixed by complete-data calibration.
train_runtime_params:
  ol_with_mask: &ol_training
    - rl_training_loop.n_batches=2000
    - rl_training_loop.frames_per_batch=256
    - rl_training_loop.eval_n_times=10
  ol_full_state: *ol_training
  # JAFA and ODIN plateau by batch 4000. The full-state variants inherit this
  # through their base method.
  jafa: &rl_training
    - rl_training_loop.n_batches=4000
  odin_model_free: *rl_training

missing_data_method_variants:
  jafa_full_state:
    base_method: jafa
    train_params:
      - agent.use_action_availability=true
    include_complete_data: true
  odin_model_free_full_state:
    base_method: odin_model_free
    train_params:
      - agent.use_action_availability=true
    include_complete_data: true
