# Synthetic pair under the complete method and treatment matrix.
artifact_namespace: core_group_missingness_v2
classifier_scope: per_instance
run_confirmatory_analysis: true
device: cuda
smoke_test: false
eval_dataset_split: val
dataset_instance_indices: [0, 1, 2, 3, 4]
datasets: [cube, cube_nm]

eval_batch_size: 128
restoration_batch_size: 1024
include_complete_data: true

missingness:
  mechanisms: [mcar, mar, mnar_logistic, mnar_self]
  probabilities: [0.3, 0.5, 0.7]

strategies:
  - restricted
  - zero_fill
  - mean_fill
  - pvae_label_conditioned
  - pvae_label_free
  - pvae_oracle
  - true_completion
  - pvae_stepwise

methods:
  - aaco
  - dime
  - ol_with_mask
  - ol_full_state
  - random_dummy

eval_params:
  - eval_only_n_samples=4096
