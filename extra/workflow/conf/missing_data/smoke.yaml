# Fast end-to-end integration check.
artifact_namespace: smoke_full_state_v1
device: cuda
smoke_test: true
eval_dataset_split: val
dataset_instance_indices: [0]
datasets: [cube_nm]
dataset_generation_params:
  cube_nm:
    - dataset.kwargs.n_samples=128
classifier_params:
  default:
    - batch_size=32
eval_batch_size: 32
restoration_batch_size: 64

missingness:
  mechanisms: [mcar]
  probabilities: [0.5]

strategies:
  - restricted
  - zero_fill
  - pvae_label_conditioned
  - pvae_label_free
  - pvae_oracle
  - true_completion
  - pvae_stepwise

# Covers direct and reweighted training, both PVAE deployments, evaluation,
# summarization, and plotting.
methods:
  - aaco
  - dime
  - ol_with_mask
  - ol_full_state

# DIME exposes smoke_test for interface consistency but does not internally
# shorten its tabular training loop, so its smoke schedule is explicit here.
pretrain_runtime_params:
  dime:
    - batch_size=32
    - nepochs=1
    - patience=1

train_runtime_params:
  dime:
    - batch_size=32
    - nepochs=1
    - patience=1
  dime_feature_marginal_ipw:
    - batch_size=32
    - nepochs=1
    - patience=1
