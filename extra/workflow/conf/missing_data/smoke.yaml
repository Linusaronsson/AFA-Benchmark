# Fast end-to-end integration check.
artifact_namespace: smoke
device: cpu
smoke_test: true
eval_dataset_split: val
dataset_instance_indices: [0]
datasets: [cube_nm]
dataset_generation_params:
  cube_nm:
    - dataset.kwargs.n_samples=128
classifier_params:
  default:
    - batch_size=32
eval_batch_size: 32
restoration_batch_size: 64

missingness:
  mechanisms: [mcar]
  probabilities: [0.5]

strategies: [restricted, pvae_label_conditioned]
methods: [aaco, dime, gdfs, jafa, ol_with_mask, ol_full_state, odin_model_free]
classifier_scope: per_instance
paper_artifacts: false
missing_data_pretrain_reuse:
  pvae:
    complete: oracle_restoration_pvae
    restricted: incomplete_restoration_pvae

pretrain_runtime_params:
  gdfs:
    - batch_size=32
  dime:
    - batch_size=32
    - nepochs=1
    - patience=1

train_runtime_params:
  dime:
    - batch_size=32
    - nepochs=1
    - patience=1
