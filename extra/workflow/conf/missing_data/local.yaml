# Small, scientifically useful local run. It is larger than smoke but remains
# intentionally separate from the full five-instance experiment artifacts.
artifact_namespace: local
device: cuda
smoke_test: false
eval_dataset_split: val
dataset_instance_indices: [0, 1]
datasets: [cube_nm, cube]
dataset_generation_params:
  cube_nm:
    - dataset.kwargs.n_samples=512
  cube:
    - dataset.kwargs.n_samples=512
classifier_params:
  default:
    - epochs=40
    - batch_size=64
restoration_pvae_params:
  default:
    - supervised_learning.max_epochs=20
    - supervised_learning.checkpoint_earliest_batch=10
    - supervised_learning.early_stopping_min_batches=20
    - supervised_learning.early_stopping_patience=5
    - supervised_learning.val_check_interval=10
eval_batch_size: 64
restoration_batch_size: 128

missingness:
  mechanisms: [mcar, mar]
  probabilities: [0.5]

strategies:
  - restricted
  - mean_fill
  - pvae_label_conditioned
  - pvae_label_free
  - pvae_oracle
  - true_completion

methods:
  - aaco
  - dime
  - odin_model_free

pretrain_runtime_params:
  dime:
    - batch_size=64
    - nepochs=20
  odin:
    - supervised_learning.max_epochs=20
    - supervised_learning.checkpoint_earliest_batch=10
    - supervised_learning.early_stopping_min_batches=20
    - supervised_learning.early_stopping_patience=5
    - supervised_learning.val_check_interval=10

train_runtime_params:
  dime:
    - batch_size=64
    - nepochs=40
  dime_feature_marginal_ipw:
    - batch_size=64
    - nepochs=40
  odin_model_free:
    - rl_training_loop.n_batches=200
    - rl_training_loop.frames_per_batch=128
    - rl_training_loop.eval_n_times=5

eval_params:
  - eval_only_n_samples=128
