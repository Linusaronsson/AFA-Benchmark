# Factual native-missingness design. Training and evaluation both retain each
# instance's source-observation mask: a value imputed during preprocessing is
# never exposed to the acquisition policy as a measurement. There is no
# true-completion/oracle arm because an unmeasured factual value is unknown.
artifact_namespace: native_missingness_v2
classifier_scope: per_instance
device: cuda
smoke_test: false
eval_dataset_split: val
dataset_instance_indices: [0, 1, 2, 3, 4]
datasets: [physionet, ckd, heart_disease, nhanes_mortality]

dataset_generation_params:
  nhanes_mortality:
    - fixed_test_seed=100
    - stratify=true

eval_batch_size: 128
restoration_batch_size: 1024
include_complete_data: false

missingness:
  mechanisms: [native]
  probabilities: [0.0]

strategies:
  - restricted
  - zero_fill
  - mean_fill
  - pvae_label_conditioned
  - pvae_label_free
  - pvae_stepwise

methods:
  - aaco
  - dime
  - ol_with_mask
  - ol_full_state

eval_params:
  - eval_only_n_samples=4096
