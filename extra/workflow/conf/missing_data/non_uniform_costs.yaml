# Non-uniform acquisition costs.
#
# Budget-limited and cost-aware acquisition are the same problem when every
# feature costs 1, which is the case everywhere else in this study.
#
#   cube_nonuniform_costs constructed costs on data where we know which
#                         features are informative, so trading cost against
#                         information correctly is identifiable.
#
# heart_disease was dropped: at 13 features every method saturates near 0.80
# regardless of which features are acquired, so cost-aware acquisition cannot be
# distinguished from lucky and the restoration gap is uninformative there.
#
# One mechanism at one rate: cost structure is the variable under study, so
# missingness is held fixed rather than allowed to confound it.
artifact_namespace: non_uniform_costs
device: cuda
smoke_test: false
eval_dataset_split: val
dataset_instance_indices: [0, 1, 2, 3, 4]
datasets: [cube_nonuniform_costs]

dataset_generation_params:
  cube_nonuniform_costs:
    - dataset.kwargs.n_samples=20000

eval_batch_size: 128
restoration_batch_size: 1024
include_complete_data: true

missingness:
  mechanisms: [mcar]
  probabilities: [0.5]

strategies:
  - restricted
  - mean_fill
  - pvae_label_conditioned
  - pvae_label_free
  - pvae_oracle
  - true_completion

methods:
  - aaco
  - dime
  - ol_without_mask
  - random_dummy

# heart_disease is 303 instances, so the eval split is small; take all of it.
eval_params:
  - eval_only_n_samples=1024
