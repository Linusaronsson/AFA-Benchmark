# Synthetic missingness: imposed mechanisms with known ground truth.
#
# Because we impose the mechanism we know what it is and retain the hidden
# values, which is what makes `true_completion` and `pvae_oracle` meaningful.
# The full restoration ladder is only available here.
#
# The datasets form a 2x2 of {synthetic, real} x {planning, flat}, so the
# restoration gap can be tied to planning structure rather than to one dataset.
#
#   cube      20 features, instance-independent signal; synthetic flat control.
#   cube_nm   55 features, synthetic planning case, the only dataset whose
#             optimal acquisition order depends on the instance. The context
#             block must be acquired before the informative block is
#             identifiable, which is what separates dynamic AFA from static
#             feature selection.
#   diabetes  NHANES-derived, 92k instances, 3-class diabetes status; real flat
#             control. In single-target classification form it has no planning
#             structure (AFABench), which is itself part of the story.
#   actg      ACTG175 clinical trial, 23 features; real planning case. AFABench
#             reports a non-myopic advantage here, so it is the real-world
#             counterpart of cube_nm and where restoration should help.
#
# `random_dummy` is the reference in every arm. Random acquisition scored 0.289
# on cube_nm where classifier chance is 0.125, so measuring against chance
# overstates method margins by roughly 80%.
artifact_namespace: synthetic_missingness
device: cuda
smoke_test: false
eval_dataset_split: val
dataset_instance_indices: [0, 1, 2, 3, 4]
datasets: [cube, cube_nm, diabetes, actg]

dataset_generation_params:
  cube:
    - dataset.kwargs.n_samples=20000
  cube_nm:
    - dataset.kwargs.n_samples=20000

eval_batch_size: 128
restoration_batch_size: 1024
include_complete_data: true

missingness:
  mechanisms: [mcar, mar, mnar_logistic, mnar_self]
  probabilities: [0.3, 0.5, 0.7]

strategies:
  - restricted
  - mean_fill
  - pvae_label_conditioned
  - pvae_label_free
  - pvae_oracle
  - true_completion

methods:
  - aaco
  - dime
  - ol_without_mask
  - random_dummy

eval_params:
  - eval_only_n_samples=1024
