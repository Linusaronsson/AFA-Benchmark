# Induced missingness on the real datasets with a complete reference.
artifact_namespace: induced_real_missingness_v2
classifier_scope: per_instance
device: cuda
smoke_test: false
eval_dataset_split: val
dataset_instance_indices: [0, 1, 2, 3, 4]
datasets: [actg, diabetes, nhanes_mortality]

dataset_generation_params:
  nhanes_mortality:
    - fixed_test_seed=100
    - stratify=true
  actg:
    - fixed_test_seed=100
    - stratify=true
  diabetes:
    - fixed_test_seed=100
    - stratify=true

eval_batch_size: 128
restoration_batch_size: 1024
include_complete_data: true
run_confirmatory_analysis: true

missingness:
  mechanisms: [mcar, mar, mnar_logistic, mnar_self]
  probabilities: [0.3, 0.5, 0.7]

methods:
  - aaco
  - dime
  - ol_with_mask
  - ol_full_state
  - random_dummy

eval_params:
  - eval_only_n_samples=4096
