# CUBE-NM restoration workflow (Phase B): does generative restoration close
# the non-myopic planning gap under training missingness? (H1 go/no-go)
# - cube_nm at its single representative hard budget (14)
# - 5 dataset instances, cold control + mcar_p05 + mar_p05
# - full restoration ladder per method family (method set restoration_core):
#     restricted -> naive fill -> reweight -> honest restore
#     -> oracle-generator restore -> oracle completion
# Built-in sanity: restoration methods under `cold` must match their `full`
# counterparts.
#
# Cluster invocation (Arrhenius):
#   uv run snakemake \
#     -s extra/workflow/snakefiles/orchestration/initializer_comparison.smk \
#     all -j 1 \
#     --configfile extra/workflow/conf/restoration_cube_nm.yaml \
#                  extra/workflow/conf/missingness_arrhenius_rezvan.yaml
# Keep the outer orchestration local (-j 1); the nested pipeline invocations
# submit to SLURM via the profile referenced in the overlay. Always dry-run
# (insert -n after `all`) before submitting.

datasets: [cube_nm]
dataset_instance_indices: [0, 1, 2, 3, 4]
train_initializers: [cold, mcar_p05, mar_p05]
eval_initializer: cold
eval_dataset_split: val
methods:
  # AACO ladder
  - aaco_zero_fill
  - aaco_impute_mean
  - aaco_mask_aware
  - aaco_dr
  - aaco_pvae_restore_honest
  - aaco_pvae_restore_labelfree
  - aaco_pvae_restore_actions # oracle-generator
  - aaco_full # oracle completion
  # OL (RL) ladder
  - ol_with_mask # restricted baseline
  - ol_pvae_restore_honest
  - ol_pvae_restore_labelfree
  - ol_pvae_restore_oracle_gen
  - ol_full # oracle completion
  # Myopic reference
  - gadgil2023
  - gadgil2023_ipw_feature_marginal
classifier_types: [external]
smoke_test: false
use_wandb: false
pipeline_cores: 8
pipeline_rerun_incomplete: true
comparison_method_set_name: restoration_core
plot_budget_mode: hard
plot_eval_hard_budget: 14.0
plot_keep_largest_hard_budget: false

pipeline_configfiles:
  - extra/workflow/conf/train_missing_eval_cold_hard.yaml
  - extra/workflow/conf/datasets_main.yaml
  - extra/workflow/conf/methods.yaml
  - extra/workflow/conf/method_sets.yaml
  - extra/workflow/conf/eval_hard_budgets_single.yaml
  - extra/workflow/conf/soft_budget_params_none.yaml
  - extra/workflow/conf/method_options.yaml
  - extra/workflow/conf/pretrain_mapping.yaml
  - extra/workflow/conf/classifier_names.yaml
  - extra/workflow/conf/unmaskers.yaml
