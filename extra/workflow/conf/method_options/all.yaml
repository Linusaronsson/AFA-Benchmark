method_options:
  aaco:
    train_script_name: "aaco"
    # AACO scores the whole eval batch in one KNN and one classifier call, so
    # this is a throughput knob. It is not purely a knob though: neighbour sets
    # are not identifiable under exact distance ties on discretised data, and
    # cuBLAS picks kernels by shape, so pin it when reproducing results.
    # Lower on the image datasets, where candidate masks are B x 100 x k x d.
    eval_batch_size: &aaco_eval_batch_size
      default: 128
      mnist: 32
      fashion_mnist: 32
      synthetic_mnist: 32
      synthetic_mnist_without_noise: 32
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  aaco_nn:
    pretrained_model_name: "aaco"
    train_script_name: "aaco_nn"
    eval_batch_size: *aaco_eval_batch_size
    hard_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
    soft_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
  eddi_builtin:
    pretrained_model_name: "pvae"
    train_script_name: "eddi_builtin"
    use_max_hard_budget_when_training_soft_budget: true
    eval_batch_size:
      default: 8
    eval_to_train_hard_budget_mapping:
      cube_nonuniform_costs:
        2: 20
        4: 20
        7: 20
    hard_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
    soft_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
  eddi_external:
    pretrained_model_name: "pvae"
    train_script_name: "eddi_external"
    use_max_hard_budget_when_training_soft_budget: true
    eval_batch_size:
      default: 8
    eval_to_train_hard_budget_mapping:
      cube_nonuniform_costs:
        2: 20
        4: 20
        7: 20
    hard_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
    soft_budget_ignored_datasets: [mnist, fashion_mnist, imagenette]
  gdfs:
    pretrained_model_name: "gdfs"
    train_script_name: "gdfs"
    use_max_hard_budget_when_training_soft_budget: true
    eval_batch_size:
      default: 32
    eval_to_train_hard_budget_mapping:
      cube_nonuniform_costs:
        2: 20
        4: 20
        7: 20
  dime:
    pretrained_model_name: "dime"
    train_script_name: "dime"
    use_max_hard_budget_when_training_soft_budget: true
    eval_batch_size:
      default: 32
    eval_to_train_hard_budget_mapping:
      cube_nonuniform_costs:
        2: 20
        4: 20
        7: 20
  l2m_real_feature_prior:
    pretrained_model_name: "l2m_real_feature_prior"
    train_script_name: "l2m"
    method_specific_params:
      - "feature_source=real"
    # Queries attend to the stored context set only, never to each other, so
    # the batch size is a throughput knob only and does not change results.
    eval_batch_size: &l2m_eval_batch_size
      default: 128
    # Hard-budget setting on miniboone only. L2M has no stop action and its
    # policy training does not depend on the budget, so one trained policy
    # serves every evaluation budget.
    eval_to_train_hard_budget_mapping: &l2m_eval_to_train_hard_budget_mapping
      miniboone:
        5: 15
        10: 15
        15: 15
    hard_budget_ignored_datasets: &l2m_ignored_datasets [actg, bank_marketing, ckd, cube, cube_nm, cube_nm_without_noise, cube_nonuniform_costs, cube_without_noise, diabetes, fashion_mnist, imagenette, mnist, physionet, synthetic_mnist, synthetic_mnist_without_noise]
    soft_budget_ignored_datasets: *l2m_ignored_datasets
  l2m_synthetic_feature_prior:
    pretrained_model_name: "l2m_synthetic_feature_prior"
    train_script_name: "l2m"
    method_specific_params:
      - "feature_source=synthetic"
    eval_batch_size: *l2m_eval_batch_size
    eval_to_train_hard_budget_mapping: *l2m_eval_to_train_hard_budget_mapping
    hard_budget_ignored_datasets: *l2m_ignored_datasets
    soft_budget_ignored_datasets: *l2m_ignored_datasets
  cae:
    train_script_name: "cae"
    eval_to_train_hard_budget_mapping:
      cube_nonuniform_costs:
        2: 20
        4: 20
        7: 20
    hard_budget_ignored_datasets: [cube_nm, cube_nm_without_noise, imagenette, synthetic_mnist, synthetic_mnist_without_noise]
    soft_budget_ignored_datasets: [cube_nm, cube_nm_without_noise, imagenette, synthetic_mnist, synthetic_mnist_without_noise]
  permutation:
    train_script_name: "permutation"
    eval_to_train_hard_budget_mapping:
      cube_nonuniform_costs:
        2: 20
        4: 20
        7: 20
    hard_budget_ignored_datasets: [cube_nm, cube_nm_without_noise, imagenette, synthetic_mnist, synthetic_mnist_without_noise]
    soft_budget_ignored_datasets: [cube_nm, cube_nm_without_noise, imagenette, synthetic_mnist, synthetic_mnist_without_noise]
  jafa:
    pretrained_model_name: "jafa"
    train_script_name: "jafa"
    eval_batch_size: &rl_eval_batch_size
      default: 128
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette, mnist, fashion_mnist] # (fashion)_mnist needs more tuning
  odin_model_based:
    pretrained_model_name: "pvae"
    train_script_name: "odin"
    method_specific_params:
      - "additional_generation_fraction=1.0"
    eval_batch_size: *rl_eval_batch_size
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette, mnist] # mnist too difficult to tune
  odin_model_free:
    pretrained_model_name: "pvae"
    train_script_name: "odin"
    method_specific_params:
      - "additional_generation_fraction=0.0"
    eval_batch_size: *rl_eval_batch_size
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette, mnist] # mnist too difficult to tune
  ol_without_mask:
    pretrained_model_name: "ol_without_mask"
    train_script_name: "ol"
    eval_batch_size: *rl_eval_batch_size
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  ol_with_mask:
    pretrained_model_name: "ol_with_mask"
    train_script_name: "ol"
    eval_batch_size: *rl_eval_batch_size
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  random_dummy:
    train_script_name: "random_dummy"
    eval_batch_size: &dummy_eval_batch_size
      default: 128
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
  sequential_dummy:
    train_script_name: "sequential_dummy"
    eval_batch_size: *dummy_eval_batch_size
    hard_budget_ignored_datasets: [imagenette]
    soft_budget_ignored_datasets: [imagenette]
