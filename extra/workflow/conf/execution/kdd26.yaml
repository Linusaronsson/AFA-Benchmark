# Declared CPU/GPU execution for the KDD '26 method set. Partitions, accounts
# and GPU request syntax belong to the cluster profile's site.yaml, not here.
# See docs/how-to/run_the_pipeline.md.
execution:
  defaults:
    classifier_training: cuda
    pretraining: cuda
    training: cpu
    evaluation: cpu
  methods:
    jafa:
      training: cuda
      evaluation: cuda
    odin_model_based:
      training: cuda
      evaluation: cuda
    gdfs:
      training: cuda
      evaluation: cuda
    eddi_external:
      training: cuda
      evaluation: cuda
    dime:
      training: cuda
      evaluation: cuda
