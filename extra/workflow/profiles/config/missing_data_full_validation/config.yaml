snakefile: extra/workflow/snakefiles/orchestration/missing_data.smk

# Local runs: missing_data.smk is a flat, embarrassingly parallel DAG.
# Without this the whole matrix runs serially. Lower it if the GPU OOMs.
cores: 4

configfile:
  - extra/workflow/conf/eval_hard_budgets/kdd26.yaml
  - extra/workflow/conf/methods/kdd26.yaml
  - extra/workflow/conf/method_sets/kdd26.yaml
  - extra/workflow/conf/method_options/kdd26.yaml
  - extra/workflow/conf/pretrain_mappings/kdd26.yaml
  - extra/workflow/conf/soft_budget_params/kdd26.yaml
  - extra/workflow/conf/unmaskers/kdd26.yaml
  - extra/workflow/conf/classifier_names/kdd26.yaml
  - extra/workflow/conf/datasets/kdd26.yaml
  - extra/workflow/conf/missing_data/design.yaml
  - extra/workflow/conf/missing_data/full_validation.yaml
