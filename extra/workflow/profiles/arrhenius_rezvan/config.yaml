# Snakemake profile for the Arrhenius SLURM cluster (Rezvan, NAISS).
# Modeled on profiles/alvis_rezvan; see conf/missingness_arrhenius_rezvan.yaml
# for the fill-in checklist (project ID, partition verification, aarch64
# venv note). Walltime cap on Arrhenius partitions is 72h (4320 min).

executor: slurm
# Keep GPU-hour burn and queue pressure under control.
jobs: 8
latency-wait: 60
retries: 2

default-resources:
  slurm_partition: cpu
  slurm_account: NAISS2026-X-YY-cpu # FILL IN: real project ID, -cpu suffix
  runtime: 60
  # If Arrhenius rejects explicit memory requests (as Alvis does), keep
  # mem_mb at 0 so sbatch gets no --mem flag; otherwise set real values.
  mem_mb: 0

set-resources:
  train_classifier:
    runtime: 120
  train_masked_mlp_classifier:
    runtime: 120
    # GPU rule: partition/account/gpus must be overridden here because the
    # per-method slurm_extra mechanism does not cover classifier training.
    slurm_extra: "--partition=gpu --account=NAISS2026-X-YY-gpu --gpus=1"
  pretrain_model:
    runtime: 1440 # 24h
  train_method_with_pretrained_model:
    runtime: 2880 # 48h, within the 72h cap
  train_method_without_pretrained_model:
    runtime: 1440 # 24h
  eval_method:
    runtime: 1440 # 24h
  eval_method_shielded:
    runtime: 1440
  eval_method_dualized:
    runtime: 1440
  count_selections:
    runtime: 30
  count_selections_soft:
    runtime: 30
  add_metadata_to_eval_data:
    runtime: 30
  add_metadata_to_eval_data_soft:
    runtime: 30
  pivot_long_classifier:
    runtime: 10
  pivot_long_classifier_soft:
    runtime: 10
  merge_eval:
    runtime: 30
  plot:
    runtime: 30
