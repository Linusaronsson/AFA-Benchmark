# Per-rule Slurm profile for the ordinary benchmark on Arrhenius (NAISS, NSC).
# The missing-data production study deliberately does not use this profile: it
# runs Snakemake inside one allocation via scripts/workflow/run_missing_data.sh.
#
# Verified against the live system on 2026-07-20:
#
#   PARTITION  GRES                          TIMELIMIT   CPUS  MEMORY(MB)  NODES
#   cpu*       (null)                        3-00:00:00   256     773500     192
#   fat        (null)                        3-00:00:00   256    3095813      20
#   gpu        gpu:nvidia_gh200_120gb:4      3-00:00:00   288     485854     382
#
# Three things differ from the Vera profile and are easy to get wrong:
#
#   1. Walltime is capped at 72h (3-00:00:00) on every partition, so nothing here
#      may exceed 4320 minutes. Vera allows 7 days; do not copy runtimes across.
#   2. The account is suffixed per side, `<project>-cpu` and `<project>-gpu`, and
#      the two are charged separately.
#   3. GPU nodes are Grace Hopper, so their CPUs are aarch64, while the login and
#      CPU nodes are x86_64. One virtualenv cannot serve both. See the note on
#      AFABENCH_SHELL_PREFIX at the bottom.
executor: slurm
jobs: 25 # 25 one-core jobs fit the account's 60000 CPU run-minute cap.
latency-wait: 60 # Lustre, so give metadata time to settle.
retries: 2

# Snakemake creates its container-image cache dir even when no containers are
# used, defaulting it to APPTAINER_CACHEDIR, which the system sets to the
# node-local /scratch/local. That path is not writable on the login node where
# the main process builds the DAG, so point it at a repo-relative dir on the
# shared filesystem instead. Relative so it stays portable across clusters.
apptainer-prefix: .snakemake/apptainer

# This general per-rule profile stays on the homogeneous x86 CPU partition.
# Missing-data GH200 runs use the single-allocation runner, which selects the
# aarch64 environment after Slurm places the allocation.
config:
  device: cpu

default-resources:
  slurm_partition: cpu
  slurm_account: naiss2026-4-1278-cpu
  runtime: 60
  cpus_per_task: 1
  mem_mb: 3000
  # These are single-node, single-process Python jobs that never use MPI, but
  # declaring an `mpi` resource makes Snakemake's jobstep executor run the
  # command directly instead of wrapping it in `srun`. On this HPE Slingshot
  # fabric that per-step `srun` otherwise fails at launch with "Error
  # configuring interconnect" when many jobs land on one node at once, killing
  # whole arms once their retries are burned. The value must be an int so it is
  # forwarded to the in-job snakemake call; `tasks_per_node` only silences the
  # submit-side warning. Neither changes placement: `--ntasks=1` is set anyway
  # and no `--nodes` is added.
  mpi: 1
  tasks_per_node: 1

# Only ordinary benchmark rules belong here. Missing-data rule resources are
# internal scheduler tokens in missing_data.smk, not Slurm submissions.
set-resources:
  pretrain_model: &network
    runtime: 600
    mem_mb: 32000
  train_method_with_pretrained_model: *network
  train_method_without_pretrained_model: *network
  eval_method:
    runtime: 240
    mem_mb: 12000
