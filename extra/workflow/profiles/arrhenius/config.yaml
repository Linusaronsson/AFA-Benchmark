# Snakemake profile for Arrhenius (NAISS, NSC). Primary cluster.
#
# Verified against the live system on 2026-07-20:
#
#   PARTITION  GRES                          TIMELIMIT   CPUS  MEMORY(MB)  NODES
#   cpu*       (null)                        3-00:00:00   256     773500     192
#   fat        (null)                        3-00:00:00   256    3095813      20
#   gpu        gpu:nvidia_gh200_120gb:4      3-00:00:00   288     485854     382
#
# Three things differ from the Vera profile and are easy to get wrong:
#
#   1. Walltime is capped at 72h (3-00:00:00) on every partition, so nothing here
#      may exceed 4320 minutes. Vera allows 7 days; do not copy runtimes across.
#   2. The account is suffixed per side, `<project>-cpu` and `<project>-gpu`, and
#      the two are charged separately. Rules are routed to the matching pair
#      below rather than all landing on one.
#   3. GPU nodes are Grace Hopper, so their CPUs are aarch64, while the login and
#      CPU nodes are x86_64. One virtualenv cannot serve both. See the note on
#      AFABENCH_SHELL_PREFIX at the bottom.
executor: slurm
jobs: 200 # Well under the 192 cpu nodes; raise once queue behaviour is known.
latency-wait: 60 # Lustre, so give metadata time to settle.
retries: 2

# Force CPU on the cluster without editing the study YAMLs, which keep
# `device: cuda` for local GPU runs. Scoped here (the workflow-profile) rather
# than the shared entry profiles precisely so local runs are unaffected. Drop
# this with the torch >= 2.10 upgrade that makes the aarch64 GH200s usable.
config:
  device: cpu

default-resources:
  slurm_partition: cpu
  slurm_account: naiss2026-4-1278-cpu
  runtime: 60
  cpus_per_task: 4
  # Nodes are 773 GB across 256 cores; request per-core rather than per-node.
  mem_mb: 8000

# Everything runs on the cpu partition for now (inherited from
# default-resources; only sizing is overridden below). Arrhenius GPUs are
# aarch64 GH200, and torch 2.7's aarch64 wheel is CPU-only, so nothing can use
# them until torch >= 2.10. Routing training jobs to `gpu` today would land them
# on GH200 nodes running CPU-only torch anyway, charging the -gpu account for
# nothing. The per-method GPU routing is restored with the torch upgrade; see
# the commented block at the bottom and Part 4 of the plan.
set-resources:
  # Network training / pretraining. On CPU these are the long jobs.
  pretrain_incomplete_restoration_pvae: &heavy_long
    runtime: 2880 # 48h, comfortably inside the 72h cap.
    cpus_per_task: 16
    mem_mb: 64000
  pretrain_oracle_restoration_pvae: *heavy_long
  pretrain_missing_data_method: *heavy_long
  train_missing_data_method_with_pretraining: *heavy_long
  train_missing_data_method_without_pretraining: *heavy_long
  train_missing_data_shared_classifier: &heavy_short
    runtime: 240
    cpus_per_task: 16
    mem_mb: 64000
  train_missing_data_method_classifier: *heavy_short
  restore_missing_training_view: *heavy_short

  # Eval and data preparation.
  eval_missing_data_method:
    # After the batching work the rollout is a small part of a job dominated by
    # startup and load, so CPU costs only 1.04-1.44x more per job, and on
    # 256-core nodes that trades far better than queueing for a GH200.
    runtime: 240
    cpus_per_task: 16
    mem_mb: 32000
  generate_missing_data_dataset:
    runtime: 120
    cpus_per_task: 8
    mem_mb: 32000
  materialize_missing_training_view:
    runtime: 60
    cpus_per_task: 4
    mem_mb: 16000

  # --- GPU routing, restore with the torch >= 2.10 upgrade (Part 4) ---------
  # Per-method placement will move into missing_data.smk `resources:` callables
  # so DIME/OL/PVAE take `gpu` while AACO stays `cpu`. Until then this is the
  # per-rule form that worked, kept for reference:
  #
  #   <heavy rule>:
  #     slurm_partition: gpu
  #     slurm_account: naiss2026-4-1278-gpu
  #     slurm_extra: "--gpus=1"
  #     runtime: 2880
  #     cpus_per_task: 16   # 72 ARM cores per superchip, 4 per node
  #     mem_mb: 60000

# `summarize_missing_data` and `plot_missing_data` are declared `localrules` in
# missing_data.smk, so they run in the submitting process and never reach the
# queue.
#
# Dual-architecture note. Snakemake submits with the login environment exported,
# which would put the x86_64 venv on an aarch64 GPU node. Export this before
# running, in single quotes so `uname -m` is evaluated inside the job:
#
#   export AFABENCH_SHELL_PREFIX='source "$AFA_BASE"/venvs/$(uname -m)/bin/activate; '
#
# `~/.bashrc.d/afabench.sh` sets AFA_BASE, UV_CACHE_DIR and
# UV_PROJECT_ENVIRONMENT onto project storage, since the CUDA wheel stack is
# multi-GB per venv and $HOME is 30 GiB. Build both venvs once, the aarch64 one
# from an interactive GPU job because NSC does not allow building GPU-side
# software on the x86_64 login node:
#
#   uv sync --group dev
#   srun -A naiss2026-4-1278-gpu -p gpu --gpus=1 -t 60 --pty bash
#   uv sync --group dev
